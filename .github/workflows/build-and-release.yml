name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Mundofy.MailMigrator.sln

    - name: Build Solution
      run: dotnet build Mundofy.MailMigrator.sln -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test Mundofy.MailMigrator.sln -c Release --no-build --verbosity normal

    - name: Publish Standalone Executable (Compressed)
      run: >
        dotnet publish src/Mundofy.MailMigrator.App/Mundofy.MailMigrator.App.csproj 
        -c Release 
        -r win-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:EnableCompressionInSingleFile=true 
        -o publish/win-x64

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-win-x64
        path: publish/win-x64/MundofyMailMigrator.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: publish/win-x64/MundofyMailMigrator.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
