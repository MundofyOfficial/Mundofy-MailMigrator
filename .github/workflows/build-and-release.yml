name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sync-changelogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean & Sync All GitHub Release Changelogs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $headers = @{
              "Authorization" = "Bearer $env:GH_TOKEN"
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "MundofyReleaseSync"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          Write-Host "Fetching all releases for $env:GH_REPO..."
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100" -Headers $headers
          
          foreach ($rel in $releases) {
              $tag = $rel.tag_name
              $version = $tag.TrimStart('v', 'V')
              $pattern = "(?s)## \[$version\].*?(?=((\r?\n## \[\d)|\Z))"
              
              if ($changelog -match $pattern) {
                  $notes = $matches[0].Trim().TrimEnd('-').Trim()
                  if ($rel.body.Trim() -ne $notes) {
                      Write-Host "Syncing release $tag (ID: $($rel.id)) to contain strictly version $version notes..."
                      $bodyObj = @{ body = $notes }
                      $json = $bodyObj | ConvertTo-Json -Compress
                      Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/$($rel.id)" -Method Patch -Headers $headers -Body $json -ContentType "application/json; charset=utf-8"
                      Write-Host "Successfully updated $tag on GitHub."
                  } else {
                      Write-Host "Release $tag is already strictly isolated."
                  }
              } else {
                  Write-Host "No matching entry in CHANGELOG.md for $tag, keeping existing release notes."
              }
          }

  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Mundofy.MailMigrator.sln

    - name: Build Solution
      id: build
      shell: pwsh
      run: |
        dotnet build Mundofy.MailMigrator.sln -c Release 2>&1 | Tee-Object build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Build Failure Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build.log

    - name: Run Unit Tests
      run: dotnet test Mundofy.MailMigrator.sln -c Release --no-build --verbosity normal

    - name: Publish Standalone Executable (Windows)
      run: >
        dotnet publish src/Mundofy.MailMigrator.App/Mundofy.MailMigrator.App.csproj 
        -c Release 
        -r win-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:EnableCompressionInSingleFile=true 
        -o publish/win-x64

    - name: Publish macOS App (Apple Silicon arm64)
      run: >
        dotnet publish src/Mundofy.MailMigrator.Mac/Mundofy.MailMigrator.Mac.csproj 
        -c Release 
        -r osx-arm64 
        --self-contained 
        -p:PublishSingleFile=true 
        -o publish/osx-arm64

    - name: Publish macOS App (Intel x64)
      run: >
        dotnet publish src/Mundofy.MailMigrator.Mac/Mundofy.MailMigrator.Mac.csproj 
        -c Release 
        -r osx-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -o publish/osx-x64

    - name: Package macOS Distributions (ZIP & .app Bundle)
      shell: pwsh
      run: |
        $plist = @"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>MundofyMailMigrator</string>
            <key>CFBundleIdentifier</key>
            <string>com.mundofy.mailmigrator</string>
            <key>CFBundleName</key>
            <string>Mundofy MailMigrator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.4.0</string>
            <key>CFBundleVersion</key>
            <string>1.4.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        "@

        # Apple Silicon (arm64) .app bundle
        $appArm = "publish/bundle-arm64/Mundofy MailMigrator.app/Contents/MacOS"
        New-Item -ItemType Directory -Force -Path $appArm | Out-Null
        Copy-Item -Path publish/osx-arm64/* -Destination $appArm -Recurse -Force
        Set-Content -Path "publish/bundle-arm64/Mundofy MailMigrator.app/Contents/Info.plist" -Value $plist -Encoding UTF8
        Compress-Archive -Path "publish/bundle-arm64/*" -DestinationPath publish/MundofyMailMigrator-macOS-arm64.zip -Force

        # Intel (x64) .app bundle
        $appX64 = "publish/bundle-x64/Mundofy MailMigrator.app/Contents/MacOS"
        New-Item -ItemType Directory -Force -Path $appX64 | Out-Null
        Copy-Item -Path publish/osx-x64/* -Destination $appX64 -Recurse -Force
        Set-Content -Path "publish/bundle-x64/Mundofy MailMigrator.app/Contents/Info.plist" -Value $plist -Encoding UTF8
        Compress-Archive -Path "publish/bundle-x64/*" -DestinationPath publish/MundofyMailMigrator-macOS-x64.zip -Force

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-win-x64
        path: publish/win-x64/MundofyMailMigrator.exe

    - name: Upload macOS arm64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-arm64
        path: publish/MundofyMailMigrator-macOS-arm64.zip

    - name: Upload macOS x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-x64
        path: publish/MundofyMailMigrator-macOS-x64.zip

    - name: Extract Release Notes & Identify Target Release
      id: release_target
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "${{ github.ref_name }}"
        } else {
            $headers = @{
                "Authorization" = "Bearer $env:GH_TOKEN"
                "Accept" = "application/vnd.github+json"
                "User-Agent" = "MundofyReleaseSync"
            }
            (Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=1" -Headers $headers)[0].tag_name
        }
        Write-Host "Target release tag: $tag"
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        $version = $tag.TrimStart('v', 'V')
        $content = Get-Content CHANGELOG.md -Raw
        $pattern = "(?s)## \[$version\].*?(?=((\r?\n## \[\d)|\Z))"
        if ($content -match $pattern) {
            $notes = $matches[0].Trim().TrimEnd('-').Trim()
            Set-Content -Path release_notes.md -Value $notes -Encoding UTF8
        } else {
            Set-Content -Path release_notes.md -Value "## $tag`n`nRelease $tag" -Encoding UTF8
        }

    - name: Publish & Attach Binaries to GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_target.outputs.tag }}
        files: |
          publish/win-x64/MundofyMailMigrator.exe
          publish/MundofyMailMigrator-macOS-arm64.zip
          publish/MundofyMailMigrator-macOS-x64.zip
        body_path: release_notes.md
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean & Sync All GitHub Release Changelogs
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "MundofyReleaseSync"
        }
        $changelog = Get-Content CHANGELOG.md -Raw
        Write-Host "Fetching all releases for $env:GH_REPO..."
        $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100" -Headers $headers
        
        foreach ($rel in $releases) {
            $tag = $rel.tag_name
            $version = $tag.TrimStart('v', 'V')
            $pattern = "(?s)## \[$version\].*?(?=((\r?\n## \[\d)|\Z))"
            
            if ($changelog -match $pattern) {
                $notes = $matches[0].Trim().TrimEnd('-').Trim()
                if ($rel.body.Trim() -ne $notes) {
                    Write-Host "Syncing release $tag (ID: $($rel.id)) to contain strictly version $version notes..."
                    $bodyObj = @{ body = $notes }
                    $json = $bodyObj | ConvertTo-Json -Compress
                    Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/$($rel.id)" -Method Patch -Headers $headers -Body $json -ContentType "application/json; charset=utf-8"
                    Write-Host "Successfully updated $tag on GitHub."
                } else {
                    Write-Host "Release $tag is already strictly isolated."
                }
            } else {
                Write-Host "No matching entry in CHANGELOG.md for $tag, keeping existing release notes."
            }
        }
