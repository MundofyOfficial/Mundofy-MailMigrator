name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Mundofy.MailMigrator.sln

    - name: Build Solution
      run: dotnet build Mundofy.MailMigrator.sln -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test Mundofy.MailMigrator.sln -c Release --no-build --verbosity normal

    - name: Publish Standalone Executable (Compressed)
      run: >
        dotnet publish src/Mundofy.MailMigrator.App/Mundofy.MailMigrator.App.csproj 
        -c Release 
        -r win-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:EnableCompressionInSingleFile=true 
        -o publish/win-x64

    - name: Prepare Versioned Artifacts
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "v1.1.0" }
        Copy-Item publish/win-x64/MundofyMailMigrator.exe "publish/win-x64/MundofyMailMigrator-$version.exe" -Force
        Get-ChildItem publish/win-x64/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-win-x64
        path: publish/win-x64/*.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/win-x64/MundofyMailMigrator-*.exe
          publish/win-x64/MundofyMailMigrator.exe
        body_path: CHANGELOG.md
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
