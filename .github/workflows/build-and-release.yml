name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sync-changelogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean & Sync All GitHub Release Changelogs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $headers = @{
              "Authorization" = "Bearer $env:GH_TOKEN"
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "MundofyReleaseSync"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          Write-Host "Fetching all releases for $env:GH_REPO..."
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100" -Headers $headers
          
          foreach ($rel in $releases) {
              $tag = $rel.tag_name
              $version = $tag.TrimStart('v', 'V')
              $pattern = "(?s)## \[$version\].*?(?=((\r?\n## \[\d)|\Z))"
              
              if ($changelog -match $pattern) {
                  $notes = $matches[0].Trim().TrimEnd('-').Trim()
                  if ($rel.body.Trim() -ne $notes) {
                      Write-Host "Syncing release $tag (ID: $($rel.id)) to contain strictly version $version notes..."
                      $bodyObj = @{ body = $notes }
                      $json = $bodyObj | ConvertTo-Json -Compress
                      Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/$($rel.id)" -Method Patch -Headers $headers -Body $json -ContentType "application/json; charset=utf-8"
                      Write-Host "Successfully updated $tag on GitHub."
                  } else {
                      Write-Host "Release $tag is already strictly isolated."
                  }
              } else {
                  Write-Host "No matching entry in CHANGELOG.md for $tag, keeping existing release notes."
              }
          }

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Mundofy.MailMigrator.sln

    - name: Build Solution
      run: dotnet build Mundofy.MailMigrator.sln -c Release

    - name: Run Unit Tests
      run: dotnet test Mundofy.MailMigrator.sln -c Release --no-build --verbosity normal

    - name: Publish Standalone Executable (Windows)
      run: >
        dotnet publish src/Mundofy.MailMigrator.App/Mundofy.MailMigrator.App.csproj 
        -c Release 
        -r win-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:EnableCompressionInSingleFile=true 
        -o publish/win-x64

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-win-x64
        path: publish/win-x64/MundofyMailMigrator.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Apple Silicon (arm64)
      run: >
        dotnet publish src/Mundofy.MailMigrator.Mac/Mundofy.MailMigrator.Mac.csproj 
        -c Release 
        -r osx-arm64 
        --self-contained 
        -p:PublishSingleFile=true 
        -o publish/arm64

    - name: Publish Intel (x64)
      run: >
        dotnet publish src/Mundofy.MailMigrator.Mac/Mundofy.MailMigrator.Mac.csproj 
        -c Release 
        -r osx-x64 
        --self-contained 
        -p:PublishSingleFile=true 
        -o publish/x64

    - name: Assemble Universal macOS .app & DMG
      run: |
        mkdir -p "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/arm64"
        mkdir -p "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/x64"
        
        # Copy compiled binaries for both architectures
        cp -R publish/arm64/* "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/arm64/"
        cp -R publish/x64/* "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/x64/"
        
        # Create universal auto-detecting launcher script
        cat << 'EOF' > "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/MundofyMailMigrator"
        #!/bin/sh
        DIR="$(cd "$(dirname "$0")" && pwd)"
        ARCH="$(uname -m)"
        if [ "$ARCH" = "arm64" ]; then
            exec "$DIR/arm64/MundofyMailMigrator" "$@"
        else
            exec "$DIR/x64/MundofyMailMigrator" "$@"
        fi
        EOF
        chmod +x "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/MundofyMailMigrator"
        chmod +x "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/arm64/MundofyMailMigrator"
        chmod +x "publish/dmg_root/Mundofy MailMigrator.app/Contents/MacOS/x64/MundofyMailMigrator"

        # Bundle Info.plist
        cat << 'EOF' > "publish/dmg_root/Mundofy MailMigrator.app/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>MundofyMailMigrator</string>
            <key>CFBundleIdentifier</key>
            <string>com.mundofy.mailmigrator</string>
            <key>CFBundleName</key>
            <string>Mundofy MailMigrator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.5.0</string>
            <key>CFBundleVersion</key>
            <string>1.5.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF

        # Zip universal .app
        cd publish/dmg_root
        zip -r -y ../MundofyMailMigrator-macOS.app.zip "Mundofy MailMigrator.app"
        cd ../..

        # Create drag-to-Applications symlink for DMG
        ln -s /Applications publish/dmg_root/Applications

        # Create Apple Disk Image (.dmg)
        hdiutil create -volname "Mundofy MailMigrator" -srcfolder "publish/dmg_root" -ov -format UDZO publish/MundofyMailMigrator-macOS.dmg

    - name: Upload macOS DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-dmg
        path: publish/MundofyMailMigrator-macOS.dmg

    - name: Upload macOS App Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-app-zip
        path: publish/MundofyMailMigrator-macOS.app.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: MundofyMailMigrator-win-x64
        path: release-assets

    - name: Download macOS DMG Artifact
      uses: actions/download-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-dmg
        path: release-assets

    - name: Download macOS App Zip Artifact
      uses: actions/download-artifact@v4
      with:
        name: MundofyMailMigrator-macOS-app-zip
        path: release-assets

    - name: Extract Release Notes & Clean Legacy Split Assets
      id: release_target
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "MundofyReleaseSync"
        }
        
        $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "${{ github.ref_name }}"
        } else {
            (Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=1" -Headers $headers)[0].tag_name
        }
        Write-Host "Target release tag: $tag"
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        # Clean legacy split architecture assets if release already exists
        try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$tag" -Headers $headers
            if ($rel -and $rel.assets) {
                foreach ($asset in $rel.assets) {
                    if ($asset.name -in @("MundofyMailMigrator-macOS-arm64.zip", "MundofyMailMigrator-macOS-x64.zip")) {
                        Write-Host "Removing legacy split asset $($asset.name)..."
                        Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/assets/$($asset.id)" -Method Delete -Headers $headers
                    }
                }
            }
        } catch {
            Write-Host "Release $tag does not exist yet or has no assets to clean."
        }

        $version = $tag.TrimStart('v', 'V')
        $content = Get-Content CHANGELOG.md -Raw
        $pattern = "(?s)## \[$version\].*?(?=((\r?\n## \[\d)|\Z))"
        if ($content -match $pattern) {
            $notes = $matches[0].Trim().TrimEnd('-').Trim()
            Set-Content -Path release_notes.md -Value $notes -Encoding UTF8
        } else {
            Set-Content -Path release_notes.md -Value "## $tag`n`nRelease $tag" -Encoding UTF8
        }

    - name: Publish & Attach Universal Binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_target.outputs.tag }}
        files: |
          release-assets/MundofyMailMigrator.exe
          release-assets/MundofyMailMigrator-macOS.dmg
          release-assets/MundofyMailMigrator-macOS.app.zip
        body_path: release_notes.md
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
