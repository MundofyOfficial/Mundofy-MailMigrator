#############################################################
# Mundofy MailMigrator Configuration File (ImapCopy.cfg)
# https://github.com/MundofyOfficial/Mundofy-MailMigrator
# All lines beginning with # are comments and will be ignored
#############################################################

##############
# Sourceserver
##############
# Protocol: IMAP (default) or POP3
SourceProtocol IMAP
SourceServer mail.oldschool.com
SourcePort 993

###################
# Destinationserver
###################
DestServer mail.newschool.com
DestPort 993


######################
# Concurrency Settings
######################
# Number of parallel account migrations (1 to 16 recommended)
Concurrency 4


#########################
# SSL / Security Settings
#########################
# Permit self-signed, untrusted, or unsigned SSL certificates (Yes / No)
# Useful for internal, staging, or self-hosted mail servers
AllowInvalidCertificates No


######################
# Logging & Exporting
######################
# Stream migration logs in real-time to a specified text file
LogFile "migration.txt"


#################
# Folders to Skip
#################
# Folders specified here will not be copied to destination
#skipfolder "INBOX.Trash"
#skipfolder "INBOX.Spam"
#skipfolder "INBOX.Junk"


####################
# Folder Name Prefix
####################
# Skip any folder starting with this prefix
#skipmatch "INBOX.Temp."


#################
# Folders to Copy
#################
# If specified, ONLY these folders will be copied
#copyfolder "INBOX"
#copyfolder "INBOX.Archive"


#######################################################
# Destination Root Folder
# Copy the entire folder structure under a subfolder
# on destination instead of root
#######################################################
#DstRootFolder "OldArchive"


#######################################################
# Empty Folder Handling
#######################################################
# Create empty folders on destination (even with 0 messages)
#CreateEmptyFolders Yes


###############################################################
# IMAP Flags Filtering
# Specify Flags that should be filtered out (DenyFlags)
# or flags that are explicitly permitted (AllowFlags)
##############################################################
DenyFlags "\Recent"
#AllowFlags "\Seen \Answered \Flagged \Deleted \Draft"


##############################################################
# Timezone Conversion
# Convert non-standard timezone offsets that target rejects
##############################################################
converttimezone "UTC" "+0000"
converttimezone "UT"  "+0000"


#############################
# List of Users and Passwords
#############################
# Format: Copy "SourceUser" "SourcePassword" "DestinationUser" "DestinationPassword"
# Use * as wildcard if Destination username or password matches Source
Copy    "alice@oldschool.com"   "SecretPass123!"   "alice@newschool.com"   "NewSecretPass1!"
Copy    "bob@oldschool.com"     "B0bSecurePass#"   "bob@newschool.com"     "B0bNewPass2026!"
Copy    "sales@oldschool.com"   "SalesDept2026"    "sales@newschool.com"   "SalesDept2026"
